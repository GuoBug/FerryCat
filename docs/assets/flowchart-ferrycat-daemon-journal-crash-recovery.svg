<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" style="background:#0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="walGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f291e"/>
    </linearGradient>
    <linearGradient id="crashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="gateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Frame Background -->
  <rect x="20" y="20" width="920" height="580" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>

  <!-- Title Section -->
  <text x="50" y="58" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.5">FERRYCAT DAEMON JOURNALING &amp; CRASH RECOVERY MATRIX (FC-404 / FC-202)</text>
  <text x="50" y="80" fill="#94a3b8" font-size="12">Write-Ahead Execution Journaling, CK-05 Safe Quarantine, and Three-Gate Git Patching Architecture</text>
  <line x1="50" y1="94" x2="910" y2="94" stroke="#1e293b" stroke-width="2"/>

  <!-- Column 1: Write-Ahead Journaling Loop (Left) -->
  <g transform="translate(50, 115)">
    <rect x="0" y="0" width="260" height="460" rx="8" fill="url(#walGrad)" stroke="#059669" stroke-width="1.5"/>
    <rect x="12" y="12" width="236" height="24" rx="4" fill="#065f46"/>
    <text x="20" y="28" fill="#d1fae5" font-size="11" font-weight="700">1. WRITE-AHEAD JOURNALING (WAL)</text>

    <!-- Step 1 -->
    <rect x="15" y="50" width="230" height="70" rx="6" fill="#0b1712" stroke="#10b981" stroke-width="1"/>
    <text x="25" y="70" fill="#a7f3d0" font-size="11" font-weight="700">Pre-Spawn Journal Flush</text>
    <text x="25" y="88" fill="#6ee7b7" font-size="10">appendJournalEntry()</text>
    <text x="25" y="104" fill="#94a3b8" font-size="9.5">event: 'TASK_DISPATCHING'</text>

    <path d="M 130 120 L 130 145" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Step 2 -->
    <rect x="15" y="150" width="230" height="70" rx="6" fill="#0b1712" stroke="#10b981" stroke-width="1"/>
    <text x="25" y="170" fill="#a7f3d0" font-size="11" font-weight="700">Child Process Spawned</text>
    <text x="25" y="188" fill="#6ee7b7" font-size="10">event: 'CHILD_SPAWNED'</text>
    <text x="25" y="204" fill="#94a3b8" font-size="9.5">Record child_pid &amp; started_at</text>

    <path d="M 130 220 L 130 245" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Step 3 -->
    <rect x="15" y="250" width="230" height="70" rx="6" fill="#0b1712" stroke="#10b981" stroke-width="1"/>
    <text x="25" y="270" fill="#a7f3d0" font-size="11" font-weight="700">Settled State Finalization</text>
    <text x="25" y="288" fill="#6ee7b7" font-size="10">event: 'TASK_SETTLED'</text>
    <text x="25" y="304" fill="#94a3b8" font-size="9.5">COMPLETED / FAILED / RETRY</text>

    <path d="M 130 320 L 130 345" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Safe Compaction -->
    <rect x="15" y="350" width="230" height="92" rx="6" fill="#042f2e" stroke="#14b8a6" stroke-width="1"/>
    <text x="25" y="372" fill="#5eead4" font-size="11" font-weight="700">Atomic Compaction</text>
    <text x="25" y="390" fill="#99f6e4" font-size="9.5">• Per-lock file: journal-&lt;lock&gt;.jsonl</text>
    <text x="25" y="408" fill="#99f6e4" font-size="9.5">• Temp + atomic rename replacement</text>
    <text x="25" y="426" fill="#99f6e4" font-size="9.5">• Triggered after N settled tasks</text>
  </g>

  <!-- Column 2: Crash Self-Healing Decisions (Middle) -->
  <g transform="translate(330, 115)">
    <rect x="0" y="0" width="300" height="460" rx="8" fill="url(#crashGrad)" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="12" y="12" width="276" height="24" rx="4" fill="#991b1b"/>
    <text x="20" y="28" fill="#fecaca" font-size="11" font-weight="700">2. TAKEOVER CRASH RECOVERY (CK-05)</text>

    <!-- Takeover trigger -->
    <rect x="15" y="48" width="270" height="60" rx="6" fill="#1c1917" stroke="#f87171" stroke-width="1"/>
    <text x="25" y="68" fill="#fca5a5" font-size="11" font-weight="700">New Leader Acquires Lease</text>
    <text x="25" y="86" fill="#94a3b8" font-size="9.5">Scan un-settled in-flight journal rows</text>
    <text x="25" y="100" fill="#ef4444" font-size="9.5">Liveness Probe: isProcessAlive(pid, 0)</text>

    <!-- Branch 1: Live Child -->
    <rect x="15" y="120" width="270" height="90" rx="6" fill="#2d0f0f" stroke="#ef4444" stroke-width="1"/>
    <text x="25" y="140" fill="#f87171" font-size="10.5" font-weight="700">A. Child Process Still Alive</text>
    <text x="25" y="158" fill="#fca5a5" font-size="9.5">• Quarantine immediately as FAILED</text>
    <text x="25" y="174" fill="#fca5a5" font-size="9.5">• Action: QUARANTINED_ORPHAN_ALIVE</text>
    <text x="25" y="192" fill="#e2e8f0" font-size="9.5">🛡️ Zero concurrent workspace collision</text>

    <!-- Branch 2: Mutation Task -->
    <rect x="15" y="222" width="270" height="90" rx="6" fill="#2d120f" stroke="#f97316" stroke-width="1"/>
    <text x="25" y="242" fill="#fdba74" font-size="10.5" font-weight="700">B. Interrupted Mutation Task</text>
    <text x="25" y="260" fill="#fed7aa" font-size="9.5">• implementation / test_generation</text>
    <text x="25" y="276" fill="#fed7aa" font-size="9.5">• Record forensic crash salvage</text>
    <text x="25" y="294" fill="#fdba74" font-size="9.5">• Action: MARKED_FAILED_MUTATION_UNSAFE</text>

    <!-- Branch 3: Read-only Safe Re-queue -->
    <rect x="15" y="324" width="270" height="118" rx="6" fill="#052e16" stroke="#22c55e" stroke-width="1"/>
    <text x="25" y="344" fill="#86efac" font-size="10.5" font-weight="700">C. Confirmed Dead + Read-Only</text>
    <text x="25" y="362" fill="#bbf7d0" font-size="9.5">• code_review / architecture_audit</text>
    <text x="25" y="378" fill="#bbf7d0" font-size="9.5">• releaseContract() back to SUBMITTED</text>
    <text x="25" y="394" fill="#86efac" font-size="9.5">• Action: RELEASED_TO_QUEUE</text>
    <text x="25" y="412" fill="#94a3b8" font-size="9">Capped at 3 releases (MAX_RELEASES limit)</text>
  </g>

  <!-- Column 3: Self-Contained Git Patch (Right) -->
  <g transform="translate(650, 115)">
    <rect x="0" y="0" width="260" height="460" rx="8" fill="url(#gateGrad)" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="12" y="12" width="236" height="24" rx="4" fill="#312e81"/>
    <text x="20" y="28" fill="#c7d2fe" font-size="11" font-weight="700">3. SELF-CONTAINED PATCH (FC-202)</text>

    <!-- Gate 1 -->
    <rect x="15" y="48" width="230" height="65" rx="6" fill="#090d16" stroke="#818cf8" stroke-width="1"/>
    <text x="25" y="68" fill="#a5b4fc" font-size="10.5" font-weight="700">Gate 1: Unified Diff Syntax</text>
    <text x="25" y="86" fill="#94a3b8" font-size="9.5">Must contain diff --git / --- / +++</text>
    <text x="25" y="100" fill="#f87171" font-size="9">Rejects prose: NOT_A_UNIFIED_DIFF</text>

    <!-- Gate 2 -->
    <rect x="15" y="123" width="230" height="65" rx="6" fill="#090d16" stroke="#818cf8" stroke-width="1"/>
    <text x="25" y="143" fill="#a5b4fc" font-size="10.5" font-weight="700">Gate 2: 100% Pointer Coverage</text>
    <text x="25" y="161" fill="#94a3b8" font-size="9.5">touchedPaths must cover pointers</text>
    <text x="25" y="175" fill="#f87171" font-size="9">Rejects mismatch: DOES_NOT_COVER</text>

    <!-- Gate 3 -->
    <rect x="15" y="198" width="230" height="75" rx="6" fill="#090d16" stroke="#818cf8" stroke-width="1"/>
    <text x="25" y="218" fill="#a5b4fc" font-size="10.5" font-weight="700">Gate 3: Hunk &amp; Content Check</text>
    <text x="25" y="236" fill="#94a3b8" font-size="9.5">Every file block must contain @@</text>
    <text x="25" y="250" fill="#94a3b8" font-size="9.5">and at least 1 +/- change line</text>
    <text x="25" y="264" fill="#f87171" font-size="9">Rejects empty header: EMPTY_HUNKS</text>

    <!-- Worker Contract -->
    <rect x="15" y="283" width="230" height="75" rx="6" fill="#1e1b4b" stroke="#a5b4fc" stroke-width="1"/>
    <text x="25" y="303" fill="#c7d2fe" font-size="10.5" font-weight="700">Worker Explicit Contract</text>
    <text x="25" y="321" fill="#e0e7ff" font-size="9.5">patch_mode: 'SELF_CONTAINED'</text>
    <text x="25" y="337" fill="#fbbf24" font-size="9">Emits explicit workspace_warning</text>

    <!-- Honest Audit -->
    <rect x="15" y="368" width="230" height="74" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="25" y="388" fill="#34d399" font-size="10.5" font-weight="700">Honest Audit Snapshot</text>
    <text x="25" y="406" fill="#94a3b8" font-size="9.5">__verified_on_disk__: "NO"</text>
    <text x="25" y="422" fill="#94a3b8" font-size="9.5">No unverified hashes recorded</text>
  </g>
</svg>
