<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" style="background:#0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="badGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="goodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#092d25"/>
    </linearGradient>
    <linearGradient id="bufferGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
  </defs>

  <!-- Frame Canvas -->
  <rect x="20" y="20" width="920" height="480" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2" filter="url(#card-shadow)"/>

  <!-- Header -->
  <text x="50" y="56" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.5">FERRYCAT TOCTOU DEFENSE &amp; REVIEW-MUTATION SEPARATION</text>
  <text x="50" y="78" fill="#94a3b8" font-size="12">Why Whole-File SHA-256 and ADR-0004 Eliminate Silent Dirty Reads and Premature Void Accidents</text>
  <line x1="50" y1="92" x2="910" y2="92" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Half: The Flawed Single-Channel Anti-Pattern -->
  <g transform="translate(50, 110)">
    <rect x="0" y="0" width="860" height="150" rx="8" fill="url(#badGrad)" stroke="#b91c1c" stroke-width="1.5"/>
    <rect x="16" y="14" width="220" height="22" rx="4" fill="#7f1d1d"/>
    <text x="24" y="29" fill="#fecaca" font-size="11" font-weight="700">ANTI-PATTERN: SINGLE CHANNEL</text>
    <text x="250" y="30" fill="#fca5a5" font-size="12">Pointers simultaneously burdened with "Read Evidence" &amp; "Disk Mutation"</text>

    <!-- Node 1: Dispatch -->
    <rect x="20" y="48" width="165" height="75" rx="6" fill="#1c1917" stroke="#7f1d1d" stroke-width="1"/>
    <text x="30" y="68" fill="#e2e8f0" font-size="11" font-weight="700">1. Dispatch Task</text>
    <text x="30" y="86" fill="#94a3b8" font-size="10">Target: src/engine.ts</text>
    <text x="30" y="104" fill="#cbd5e1" font-size="10">SHA: a1b2c3 (32,909 B)</text>

    <!-- Arrow 1 -->
    <line x1="185" y1="85" x2="225" y2="85" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>

    <!-- Node 2: Well-intentioned Reviewer Mutates -->
    <rect x="235" y="48" width="180" height="75" rx="6" fill="#1c1917" stroke="#7f1d1d" stroke-width="1"/>
    <text x="245" y="68" fill="#e2e8f0" font-size="11" font-weight="700">2. Reviewer Edits Disk</text>
    <text x="245" y="86" fill="#f87171" font-size="10">Fixes 6 comment drifts</text>
    <text x="245" y="104" fill="#fca5a5" font-size="10">Size: 33,103 B (Altered)</text>

    <!-- Arrow 2 -->
    <line x1="415" y1="85" x2="455" y2="85" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>

    <!-- Node 3: Watchdog Strict Check -->
    <rect x="465" y="48" width="180" height="75" rx="6" fill="#1c1917" stroke="#dc2626" stroke-width="1"/>
    <text x="475" y="68" fill="#fca5a5" font-size="11" font-weight="700">3. TOCTOU Watchdog</text>
    <text x="475" y="86" fill="#fecaca" font-size="10">Byte mismatch detected</text>
    <text x="475" y="104" fill="#f87171" font-size="10">"Disk modified underfoot"</text>

    <!-- Arrow 3 -->
    <line x1="645" y1="85" x2="685" y2="85" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>

    <!-- Node 4: Fatal Stale Crash -->
    <rect x="695" y="48" width="145" height="75" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
    <text x="705" y="70" fill="#ffffff" font-size="11" font-weight="800">POINTER_STALE</text>
    <text x="705" y="88" fill="#fecaca" font-size="10">Contract VOIDED</text>
    <text x="705" y="104" fill="#fecaca" font-size="10">30m labor lost!</text>
  </g>

  <!-- Bottom Half: The Robust ADR-0004 Architecture -->
  <g transform="translate(50, 280)">
    <rect x="0" y="0" width="860" height="200" rx="8" fill="url(#goodGrad)" stroke="#10b981" stroke-width="2"/>
    <rect x="16" y="14" width="260" height="22" rx="4" fill="#047857"/>
    <text x="24" y="29" fill="#ffffff" font-size="11" font-weight="700">ADR-0004: REVIEW-MUTATION SEPARATION</text>
    <text x="290" y="29" fill="#34d399" font-size="12">Immutable Evidence Channel + Standardized Diff Fixes + Strike Buffering</text>

    <!-- Track 1: Pointers Evidence Channel -->
    <rect x="20" y="50" width="400" height="58" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1.2"/>
    <text x="32" y="70" fill="#34d399" font-size="11" font-weight="700">Track A: Pointers Read-Only Evidence Channel</text>
    <text x="32" y="88" fill="#a7f3d0" font-size="10">Verified SHA-256 stays 100% immutable throughout the review lifecycle</text>

    <!-- Track 2: Patch Fixes Channel -->
    <rect x="20" y="120" width="400" height="58" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="32" y="140" fill="#38bdf8" font-size="11" font-weight="700">Track B: Structured Patch Fixes Channel</text>
    <text x="32" y="158" fill="#bae6fd" font-size="10">Fixes delivered as Git Diff in structured_output.fixes; zero disk dirty write</text>

    <!-- Right Side: 2-Tier Safety Net -->
    <rect x="445" y="50" width="395" height="128" rx="6" fill="url(#bufferGrad)" stroke="#6366f1" stroke-width="1.5"/>
    <text x="460" y="74" fill="#a5b4fc" font-size="12" font-weight="700">Two-Tier Operational Defense &amp; Strike Buffer</text>

    <!-- Sub-tier 1 -->
    <circle cx="470" cy="98" r="4" fill="#10b981"/>
    <text x="482" y="102" fill="#e2e8f0" font-size="11"><tspan font-weight="700" fill="#34d399">Pre-Flight Verify:</tspan> Read-only probe detects collisions before fulfillment</text>

    <!-- Sub-tier 2 -->
    <circle cx="470" cy="126" r="4" fill="#06b6d4"/>
    <text x="482" y="130" fill="#e2e8f0" font-size="11"><tspan font-weight="700" fill="#38bdf8">1-Strike Soft Buffer:</tspan> Mismatch returns RETRY_NEEDED with stash guide</text>

    <!-- Sub-tier 3 -->
    <circle cx="470" cy="154" r="4" fill="#fbbf24"/>
    <text x="482" y="158" fill="#e2e8f0" font-size="11"><tspan font-weight="700" fill="#fcd34d">Quota Anti-Laundering:</tspan> release resets extend_count, preserves retry_count</text>
  </g>
</svg>
