<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <filter id="neoShadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="620" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="936" height="596" rx="8" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Title Banner -->
  <rect x="28" y="24" width="904" height="54" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2" filter="url(#neoShadow)"/>
  <text x="44" y="57" font-size="15" font-weight="800" fill="#f8fafc" letter-spacing="0.5">FERRYCAT · 为什么单机多开 AI 窗口需要一条“契约摆渡船”？</text>
  <rect x="668" y="36" width="248" height="30" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="682" y="56" font-size="11" font-weight="700" fill="#6ee7b7">REAL WORKFLOW · 3 MODELS VERIFIED</text>

  <!-- ================= UPPER HALF: WITHOUT FERRYCAT (PAIN POINTS) ================= -->
  <g transform="translate(28, 92)">
    <rect width="904" height="202" rx="8" fill="#140c14" stroke="#f43f5e" stroke-width="2" filter="url(#neoShadow)"/>
    <rect x="14" y="12" width="380" height="26" rx="4" fill="#be123c"/>
    <text x="24" y="29" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="0.5">❌ 现状痛点：当你在电脑上同时打开两个 AI 编程软件</text>
    <text x="410" y="29" font-size="10.5" fill="#fda4af">主力模型写代码 + 独立模型做审查，原本为了防盲区，却把人逼成了剪贴板搬运工</text>

    <!-- Pain 1 -->
    <rect x="14" y="50" width="208" height="136" rx="6" fill="#1f121b" stroke="#881337" stroke-width="1.5"/>
    <text x="24" y="72" font-size="11.5" font-weight="800" fill="#fb7185">1. 同模型“自审自批”失灵</text>
    <text x="24" y="95" font-size="10" fill="#e2e8f0">让刚写完代码的 AI 审查自己</text>
    <text x="24" y="114" font-size="10" fill="#e2e8f0">顺着既有思路滑行，盲区照旧</text>
    <rect x="24" y="132" width="188" height="40" rx="4" fill="#0f070c" stroke="#4c0519" stroke-width="1"/>
    <text x="32" y="150" font-size="9.5" fill="#fda4af">必须引入不同厂商/不同视角的</text>
    <text x="32" y="165" font-size="9.5" fill="#fda4af">独立宿主窗口进行交叉互审</text>

    <!-- Pain 2 -->
    <rect x="236" y="50" width="208" height="136" rx="6" fill="#1f121b" stroke="#881337" stroke-width="1.5"/>
    <text x="246" y="72" font-size="11.5" font-weight="800" fill="#fb7185">2. 人肉剪贴板与 Token 浪费</text>
    <text x="246" y="95" font-size="10" fill="#e2e8f0">全选复制几百行代码与背景要求</text>
    <text x="246" y="114" font-size="10" fill="#e2e8f0">来回粘贴，两头重复烧 Token</text>
    <rect x="246" y="132" width="188" height="40" rx="4" fill="#0f070c" stroke="#4c0519" stroke-width="1"/>
    <text x="254" y="150" font-size="9.5" fill="#fda4af">代码稍长就被截断，复制漏文件</text>
    <text x="254" y="165" font-size="9.5" fill="#fda4af">切 10 次窗口人先累趴下了</text>

    <!-- Pain 3 -->
    <rect x="458" y="50" width="212" height="136" rx="6" fill="#1f121b" stroke="#881337" stroke-width="1.5"/>
    <text x="468" y="72" font-size="11.5" font-weight="800" fill="#fb7185">3. 旧文件上的“静默盲审”</text>
    <text x="468" y="95" font-size="10" fill="#e2e8f0">窗口 A 改了代码还没保存落盘</text>
    <text x="468" y="114" font-size="10" fill="#e2e8f0">或者刚切了分支、顺手改了两行</text>
    <rect x="468" y="132" width="192" height="40" rx="4" fill="#0f070c" stroke="#4c0519" stroke-width="1"/>
    <text x="476" y="150" font-size="9.5" fill="#fda4af">窗口 B 读着磁盘旧文件一本正经</text>
    <text x="476" y="165" font-size="9.5" fill="#fda4af">挑刺，输出一页完全失真的废话</text>

    <!-- Pain 4 -->
    <rect x="684" y="50" width="206" height="136" rx="6" fill="#1f121b" stroke="#881337" stroke-width="1.5"/>
    <text x="694" y="72" font-size="11.5" font-weight="800" fill="#fb7185">4. 作文式回复与返工死循环</text>
    <text x="694" y="95" font-size="10" fill="#e2e8f0">审查方洋洋洒洒写两千字散文</text>
    <text x="694" y="114" font-size="10" fill="#e2e8f0">没有明确“过/不过”与逐条清单</text>
    <rect x="694" y="132" width="186" height="40" rx="4" fill="#0f070c" stroke="#4c0519" stroke-width="1"/>
    <text x="702" y="150" font-size="9.5" fill="#fda4af">开发方不知道改哪条，或者两边</text>
    <text x="702" y="165" font-size="9.5" fill="#fda4af">意见打架陷入无休止的拉锯</text>
  </g>

  <!-- ================= LOWER HALF: WITH FERRYCAT (HONEST CONTRACT BUS) ================= -->
  <g transform="translate(28, 310)">
    <rect width="904" height="282" rx="8" fill="#0b1320" stroke="#06b6d4" stroke-width="2" filter="url(#neoShadow)"/>
    <rect x="14" y="12" width="420" height="26" rx="4" fill="#0891b2"/>
    <text x="24" y="29" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="0.5">✅ FerryCat 真实工作流：人做窗口触发，工单总线管住契约与一致性</text>
    <text x="450" y="29" font-size="10.5" fill="#67e8f9">不吹嘘虚假的“后台全自动唤醒”，用 3 次切窗口换取 100% 确定性的跨宿主互审</text>

    <!-- Step 1: Window A -->
    <rect x="16" y="52" width="256" height="148" rx="6" fill="#111827" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="26" y="62" width="168" height="20" rx="3" fill="#0369a1"/>
    <text x="34" y="76" font-size="10" font-weight="700" fill="#e0f2fe">STEP 1 · 主力编码 Agent 窗口</text>
    <text x="26" y="100" font-size="10.5" font-weight="700" fill="#f8fafc">“帮我发一张代码审查工单”</text>
    <text x="26" y="120" font-size="9.5" fill="#cbd5e1">● 不传长篇源码，只传文件路径与行号</text>
    <text x="26" y="138" font-size="9.5" fill="#cbd5e1">● 自动给当前磁盘文件拍下特征快照</text>
    <text x="26" y="156" font-size="9.5" fill="#cbd5e1">● 展示文件首末行，防编辑器未保存</text>
    <text x="26" y="176" font-size="9.5" fill="#38bdf8">● 附带刚性交卷模板（必须给通过/清单）</text>

    <!-- Arrow 1 -> Bus -->
    <line x1="272" y1="126" x2="316" y2="126" stroke="#06b6d4" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
    <text x="276" y="116" font-size="9" font-weight="700" fill="#67e8f9">派单落库</text>

    <!-- Center: FerryCat Bus -->
    <rect x="322" y="52" width="260" height="148" rx="6" fill="#06191d" stroke="#10b981" stroke-width="2"/>
    <rect x="334" y="62" width="236" height="22" rx="3" fill="#047857"/>
    <text x="352" y="77" font-size="10.5" font-weight="800" fill="#ecfdf5">FerryCat 本地工单摆渡站 (SQLite)</text>
    <text x="334" y="102" font-size="9.5" fill="#a7f3d0">🔒 乐观锁抢单：多开审查窗口绝不重复领单</text>
    <text x="334" y="122" font-size="9.5" fill="#a7f3d0">🛡️ 防盲审拦截：领单与交单两次核对文件快照</text>
    <text x="348" y="138" font-size="9" fill="#6ee7b7">一旦文件被中途偷改，立即废止工单拒收</text>
    <text x="334" y="158" font-size="9.5" fill="#a7f3d0">📐 交卷格式门禁：不合规范打回重写（限 2 次）</text>
    <text x="334" y="178" font-size="9.5" fill="#fde047">🚫 敏感文件黑名单：自动拦下 .env / 密钥文件</text>

    <!-- Arrow Bus -> Step 2 -->
    <line x1="582" y1="126" x2="626" y2="126" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowEmerald)"/>
    <text x="586" y="116" font-size="9" font-weight="700" fill="#6ee7b7">切窗领单</text>

    <!-- Step 2: Window B -->
    <rect x="632" y="52" width="256" height="148" rx="6" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
    <rect x="642" y="62" width="168" height="20" rx="3" fill="#065f46"/>
    <text x="650" y="76" font-size="10" font-weight="700" fill="#d1fae5">STEP 2 · 独立审查 Agent 窗口</text>
    <text x="642" y="100" font-size="10.5" font-weight="700" fill="#f8fafc">“拉取待办工单并按要求交卷”</text>
    <text x="642" y="120" font-size="9.5" fill="#cbd5e1">● 核对磁盘文件与派单快照分毫不差</text>
    <text x="642" y="138" font-size="9.5" fill="#cbd5e1">● 直接读取本地源码，零剪贴板损耗</text>
    <text x="642" y="156" font-size="9.5" fill="#cbd5e1">● 异构模型（DeepSeek/Step-5/Hy3）挑刺</text>
    <text x="642" y="176" font-size="9.5" fill="#34d399">● 按契约填表交单，切回主窗口一键验收</text>

    <!-- Empirical Footer Bar -->
    <rect x="16" y="212" width="872" height="56" rx="6" fill="#020617" stroke="#334155" stroke-width="1.5"/>
    <text x="28" y="234" font-size="10.5" font-weight="800" fill="#fbbf24">📊 真实存在性验证（Demo 实机轨迹）：用 FerryCat 审 FerryCat 自己</text>
    <text x="28" y="254" font-size="9.5" fill="#94a3b8">从主力编码 Agent 派发 3 张真实工单至独立审查 Agent 搭载的 Deepseek-V4.1-Flash (241s)、Step-5-Preview (354s)、Hy3 (463s)，抓出并合入 9 项真实漏洞。</text>
  </g>
</svg>
